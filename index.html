<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>International Pricing Card</title>
    <style>
      @keyframes shake-x {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      .hover-shake:hover {
        animation: shake-x 0.3s ease-in-out;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6"
  >
    <section class="max-w-sm w-full">
      <div
        class="bg-slate-900 p-8 rounded-3xl border-2 border-indigo-500 shadow-2xl shadow-indigo-500/10 flex flex-col gap-6 relative"
      >
        <span
          class="absolute -top-3.5 right-8 bg-indigo-600 text-white text-[10px] px-3.5 py-1 rounded-full uppercase tracking-wider shadow-md"
        >
          Most Popular
        </span>

        <div class="flex flex-col gap-2 border-b border-slate-800 pb-6">
          <h3 class="text-xl font-bold text-white tracking-wide">
            Pro Developer Plan
          </h3>
          <p class="text-xs text-slate-400">
            Perfect for freelance web developers and agencies.
          </p>
          <div class="flex items-baseline gap-1 mt-2">
            <span class="text-4xl font-extrabold text-indigo-400">$29</span>
            <span class="text-xs text-slate-400">/ month</span>
          </div>
        </div>

        <ul class="flex flex-col gap-3 text-xs text-slate-300">
          <li class="flex items-center gap-3">
            <span class="text-amber-400 font-bold">✓</span>Unlimited Tailwind
            Components
          </li>
          <li class="flex items-center gap-3">
            <span class="text-amber-400 font-bold">✓</span>Responsive mobile and
            Desktop Layouts
          </li>
          <li class="flex items-center gap-3">
            <span class="text-amber-400 font-bold">✓</span>Priority client
            support 24/7
          </li>
          <li class="flex items-center gap-3">
            <span class="text-amber-400 font-bold">✓</span>Source code and Figma access
          </li>
        </ul>

        <button
          class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-3 rounded-xl transition-all duration-200 hover-shake cursor-pointer mt-2 shadow-lg"
        >
          Get Started Now
        </button>
      </div>
    </section>
  </body>
</html>
